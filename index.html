<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="./srs/css/style.css">
</head>

<body>
    <div class="calculadora">
        <div class="display"></div>
        <div class="botoes">
            <button class="vermelho limpar">C</button>
            <button class="laranja operador" data-op="%">%</button>
            <button class="laranja operador" data-op="/">/</button>
            <button class="laranja operador" data-op="*">*</button>

            <button class="cinza numero" data-num="7">7</button>
            <button class="cinza numero" data-num="8">8</button>
            <button class="cinza numero" data-num="9">9</button>
            <button class="laranja operador" data-op="-">-</button>

            <button class="cinza numero" data-num="4">4</button>
            <button class="cinza numero" data-num="5">5</button>
            <button class="cinza numero" data-num="6">6</button>
            <button class="laranja operador" data-op="+">+</button>

            <button class="cinza numero" data-num="1">1</button>
            <button class="cinza numero" data-num="2">2</button>
            <button class="cinza numero" data-num="3">3</button>
            <button class="verde igual" id="igual">=</button>

            <button class="cinza zero numero" data-num="0">0</button>
            <button class="cinza ponto" data-num=".">.</button>
        </div>
    </div>
    <script src="./srs/js/intex.js"></script>
</body>

</html>
